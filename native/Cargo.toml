[package]
name = "teamy-whisper-native"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Source-defined Whisper inference with resident CUDA tensors"

[workspace]

[dependencies]
anyhow = "1"
half = "2.7"
memmap2 = "0.9"
safetensors = "0.6"
facet = { package = "teamy-facet", version = "=0.50.0-rc.10" }
facet-json = { package = "teamy-facet-json", version = "=0.50.0-rc.12" }
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
rustfft = "6.4"
hound = "3.5"

[build-dependencies]
cc = "1.2"

[lints.clippy]
disallowed_macros = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
