[package]
name = "teamy-transcriber"
version = "0.1.0"
edition = "2024"
authors = ["TeamDman"]
description = "A local-first transcription utility for audio, video, and microphone recordings"
license = "MPL-2.0"
readme = "README.md"
repository = "https://github.com/TeamDman/teamy-transcriber"
keywords = ["transcription", "audio", "video", "whisper"]
categories = ["multimedia::audio", "command-line-utilities"]
documentation = "https://github.com/TeamDman/teamy-transcriber"

[workspace]
exclude = ["native", "tools/rust-whisperx-bench"]

[dependencies]
teamy-whisper-native = { path = "native" }
arbitrary = { version = "1.4.1", features = ["derive"] }
arboard = { version = "3.6.1", default-features = false }
ash = "0.38"
ash-window = "0.13"
safetensors = "=0.6.2"
memmap2 = "=0.9.11"
chrono = "0.4"
color-eyre = "0.6.5"
eyre = "0.6.12"
fontdue = "0.9.3"
hound = "3.5.1"
sha2 = "0.10.9"
tokenizers = { version = "0.22.0", default-features = false, features = ["onig"] }
raw-window-handle = "0.6"
thiserror = "1.0.69"
tracing = "0.1.41"
teamy-tracing = "=0.2.3"
tracing-subscriber = { version = "0.3.19", default-features = false, features = [
    "ansi",
    "env-filter",
    "fmt",
    "registry",
] }
tracing-tracy = { version = "0.11", optional = true, default-features = false, features = ["enable", "system-tracing", "context-switch-tracing", "sampling", "code-transfer", "callstack-inlines", "only-localhost"] }
directories-next = "2"
tokio = { version = "1.49.0", features = ["full"] }
uuid = { version = "1.23.4", features = ["v4"] }
teamy-cancellation = { version = "=0.8.3", features = ["async", "figue", "arbitrary", "io"] }
facet = { package = "teamy-facet", version = "=0.50.0-rc.10", features = ["uuid", "compact_str", "chrono", "net", "reflect"] }
facet-csv = { package = "teamy-facet-csv", version = "=0.50.0-rc.12" }
facet-json = { package = "teamy-facet-json", version = "=0.50.0-rc.12" }
facet-pretty = { package = "teamy-facet-pretty", version = "=0.50.0-rc.8" }
figue = { package = "teamy-figue", version = "=6.0.0-rc.8", features = ["arbitrary"] }
open = "5"
rfd = "0.15"
winit = "0.30"

[target.'cfg(windows)'.dependencies]
cpal = "0.15.3"
windows = { version = "0.62.2", features = [
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Globalization",
    "Win32_System_Console",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
extended_observability = []
tracy = ["extended_observability", "dep:tracing-tracy"]

[build-dependencies]
embed-resource = "3.0.6"

[lints.rust]
ambiguous_negative_literals = "warn"
unfulfilled_lint_expectations = "deny"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[lints.clippy]
absolute_paths = "warn"
disallowed_macros = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
multiple_crate_versions = "allow" # turn this off periodically to see how bad it has gotten :P
# nursery = { level = "warn", priority = -1 }  # optional, might cause more false positives
multiple_unsafe_ops_per_block = "deny"
module_inception = "allow"
allow_attributes = "deny"
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "allow" # facet macros use Unicode identifiers
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
